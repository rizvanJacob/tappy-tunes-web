<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TappyTunes - Redirects</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        font-family: "Georgia", "Times New Roman", serif;
        margin: 0;
        padding: 48px 24px;
        background: #f7f3eb;
        color: #2d2a26;
      }
      .wrap {
        max-width: 720px;
        margin: 0 auto;
      }
      h1 {
        font-size: 32px;
        margin: 0 0 16px;
        letter-spacing: 0.5px;
      }
      p {
        margin: 0 0 20px;
        line-height: 1.6;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 24px 0 0;
      }
      li + li {
        margin-top: 12px;
      }
      a {
        color: #2d2a26;
        text-decoration: none;
        border-bottom: 2px solid #d1b989;
        padding-bottom: 2px;
      }
      a:hover {
        border-bottom-color: #8b6d3b;
      }
      .note {
        font-size: 14px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Redirecting you to <span data-redirect-title>your destination</span>...</h1>
      <p>
        If you are not redirected automatically, please choose a link below.
      </p>
      <ul data-redirect-list></ul>
    </div>
    <script src="redirects.js" defer></script>
  </body>
</html>
